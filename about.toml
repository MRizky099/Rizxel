# cargo-about configuration: which dependency licenses may ship in Rizxel's
# packages. Rizxel is GPL-3.0-or-later, so every license here must be
# compatible with it. `cargo about generate` fails on anything else, which
# fails the release workflow (.github/workflows/release.yml).
accepted = [
    "GPL-3.0-or-later",
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "0BSD",
    "Unlicense",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "CDLA-Permissive-2.0",
]
# Only what ships: the targets the release packages are built for.
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# Rizxel's own crates are covered by LICENSE.
private = { ignore = true }
