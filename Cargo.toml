[workspace]
resolver = "2"
members = [
    "rizxel-math",
    "rizxel-engine",
    "rizxel-io",
    "rizxel-app",
    "rizxel-ui",
    # Vendored craft-ui with Rizxel's tab-strip change; see vendor/craft-ui/README.md.
    "vendor/craft-ui",
]

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Muhammad Rizky Abdillah (MRizky099)"]
rust-version = "1.85"

[workspace.dependencies]
# Internal crates (layered: ui -> app -> io -> engine -> math)
rizxel-math = { path = "rizxel-math" }
rizxel-engine = { path = "rizxel-engine" }
rizxel-io = { path = "rizxel-io" }
rizxel-app = { path = "rizxel-app" }

# External
glam = { version = "0.34", features = ["serde", "bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Per-user app data folder (recent files, autosave recovery).
directories = "6"
zstd = "0.14"
# Same version image 0.25 already pulls in; palette textures and Goxel blocks.
png = "0.18"
# zlib for Qubicle .qbt matrices (already in the tree through png/image).
flate2 = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
winresource = "0.1"
# egui-phosphor 0.14 targets egui 0.36, so eframe/egui are pinned to 0.36.
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts", "accesskit", "x11", "wayland"] }
egui = "0.36"
egui-phosphor = "0.14"
# Panel docking shared with CADCraft (transactional layout model + egui surface).
# Vendored from storytold/craft-libs at ae2f796 plus Fill / Scroll tab strips; back to a
# git rev once upstream has them (vendor/craft-ui/README.md).
craft-ui = { path = "vendor/craft-ui" }
# Same major as the wgpu pulled in by eframe 0.36; used to validate WGSL in tests.
naga = { version = "30", features = ["wgsl-in"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package."*"]
# Optimize dependencies in debug builds so wgpu/egui stay responsive.
opt-level = 2
