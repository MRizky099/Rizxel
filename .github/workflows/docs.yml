name: Docs

# Builds the user guide (docs/guide, mdBook) on every push and pull request
# that touches it, and publishes it to GitHub Pages from main:
# https://mrizky099.github.io/Rizxel/
#
# Publishing needs Pages enabled once in the repository settings
# (Settings > Pages > Source: GitHub Actions).
on:
  push:
    branches: [main]
    paths: ["docs/guide/**", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/guide/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  MDBOOK_VERSION: 0.5.4

jobs:
  build:
    name: build the guide
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Install mdBook
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/bin" mdbook
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - run: mdbook build docs/guide
      - uses: actions/upload-pages-artifact@v4.0.0
        with:
          path: docs/guide/book

  deploy:
    name: publish to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4.0.5
