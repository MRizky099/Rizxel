name: Release

# A `v*` tag builds the packages for every platform and publishes them with
# the sample models as a GitHub pre-release (0.x betas and `-rc` versions).
# Stable versions get a draft that is published by hand.
#
# Run it by hand (Actions > Release > Run workflow, or
# `gh workflow run release.yml -f tag=v0.10.0`) to build and publish an
# existing tag with this workflow file, e.g. after fixing the workflow.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish, e.g. v0.10.0"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # The tag being released: the pushed tag, or the one given by hand.
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  licenses:
    name: third-party licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ env.TAG }}
      - run: rustup toolchain install
      - name: Install cargo-about
        run: cargo install cargo-about --locked --features cli --version 0.9.3
      # Fails when a dependency's license isn't on the allow-list in about.toml
      # (GPL-3.0-compatible licenses only).
      - name: Check licenses and write THIRD_PARTY_LICENSES.html
        run: cargo about generate --fail about.hbs -o THIRD_PARTY_LICENSES.html
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: third-party-licenses
          path: THIRD_PARTY_LICENSES.html

  windows:
    name: Windows (zip + MSI)
    needs: licenses
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ env.TAG }}
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2.7.8
      - uses: actions/download-artifact@v4.3.0
        with:
          name: third-party-licenses
      - run: cargo build --release --locked -p rizxel-ui
      - name: Install WiX Toolset 5
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add --global WixToolset.UI.wixext/5.0.2
      - name: Package
        shell: pwsh
        run: packaging/wix/build.ps1 -Version "$($env:TAG.TrimStart('v'))"
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: windows
          path: |
            Rizxel-*.zip
            Rizxel-*.msi

  linux:
    name: Linux (AppImage)
    needs: licenses
    # The oldest supported runner, so the AppImage runs on older glibc.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ env.TAG }}
      - name: Install Linux packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev file \
            desktop-file-utils
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2.7.8
      - uses: actions/download-artifact@v4.3.0
        with:
          name: third-party-licenses
      - run: cargo build --release --locked -p rizxel-ui
      - name: Fetch appimagetool
        run: |
          curl -fsSL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-x86_64.AppImage
          chmod +x appimagetool
      - name: Package
        run: sh packaging/appimage/build.sh "${TAG#v}" ./appimagetool
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: linux
          path: Rizxel-*.AppImage

  macos:
    name: macOS (universal dmg)
    needs: licenses
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ env.TAG }}
      - run: rustup toolchain install
      - run: rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2.7.8
      - uses: actions/download-artifact@v4.3.0
        with:
          name: third-party-licenses
      - run: cargo build --release --locked -p rizxel-ui --target x86_64-apple-darwin
      - run: cargo build --release --locked -p rizxel-ui --target aarch64-apple-darwin
      - name: Package
        run: sh packaging/macos/build.sh "${TAG#v}"
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: macos
          path: Rizxel-*.dmg

  release:
    name: Pre-release
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.tag, 'v')
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Sample models
        run: |
          cd assets
          zip -r "../dist/Rizxel-${TAG#v}-samples.zip" samples
      # Notes: the version's CHANGELOG section, a link per package, the
      # install notes for unsigned builds, the license and the source.
      - name: Release notes
        run: sh packaging/release_notes.sh "${TAG#v}" "${{ github.repository }}" dist > notes.md
      # 0.x versions and versions with a suffix (1.0.0-rc.1) are betas:
      # published as pre-releases. Code signing is not set up yet (no
      # certificates); the notes carry the install steps for unsigned builds.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          flags="--prerelease"
          case "$version" in
            0.*|*-*) ;;
            *) flags="--draft" ;;
          esac
          gh release create "$TAG" dist/* $flags --verify-tag \
            --title "Rizxel $version" --notes-file notes.md
