name: CI

on:
  push:
    branches: [main, "ui-*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      # Installs the toolchain and components from rust-toolchain.toml.
      - run: rustup toolchain install
      - run: cargo fmt --all -- --check

  check:
    name: clippy + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev
      - run: rustup toolchain install
      # Also caches ~/.cargo/git, which holds the craft-ui git dependency.
      - uses: Swatinem/rust-cache@v2.7.8
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
